{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SceneIt</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  </head>

  <body>
    <h1>SceneIt</h1>

    <div class="input-box">
      <p>Enter two or more Letterboxd usernames:</p>

      <div id="username-fields">
        <input
          type="text"
          placeholder="Username"
          class="username-input"
          name="username"
        />
      </div>

      <div id="button-row">
        <button id="compare-btn">Compare Watchlists</button>
        <button id="clear-btn" class="secondary">Clear</button>
      </div>
    </div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Comparing watchlists...</p>
    </div>

    <div id="results"></div>

    <script src="{% static 'js/app.js' %}"></script>
  </body>
</html>
